name: Validate Framework Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate and package the current version
        run: |
          TAG="$(python -c 'import json; print("v" + json.load(open("Assets/BlackholeFramework/Version.json"))["version"])')"
          python scripts/export_unitypackage.py --tag "$TAG" --output dist
