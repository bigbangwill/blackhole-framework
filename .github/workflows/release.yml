name: Release Blackhole Framework

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the exporter
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Export framework assets
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            TAG="$REF_NAME"
          else
            TAG="$(python -c 'import json; print("v" + json.load(open("Assets/BlackholeFramework/Version.json"))["version"])')"
          fi
          python scripts/export_unitypackage.py --tag "$TAG" --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlackholeFramework-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          EXTRA_ARGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then EXTRA_ARGS+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Blackhole Framework $RELEASE_TAG" --generate-notes "${EXTRA_ARGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
